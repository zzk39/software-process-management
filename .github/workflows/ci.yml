name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Seed database
        run: python -m app.seed
      - name: Run tests
        run: python -m pytest -q --junitxml=report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-report
          path: backend/report.xml

  admin-web:
    name: Admin Web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run build

  student-web:
    name: Student Web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-web/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    name: Docs · Lint RFC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 RFC 文件齐全（21 份 + 索引）
        run: |
          cd rfcs
          count=$(ls RFC-*.md | wc -l)
          if [ "$count" -lt 22 ]; then
            echo "期望 22 份 RFC，实际 $count" && exit 1
          fi
          # 每份必须引用对应 story 章节
          for f in RFC-0*.md; do
            if ! grep -q "对应章节" "$f"; then
              echo "$f 缺少 '对应章节' 字段" && exit 1
            fi
          done
